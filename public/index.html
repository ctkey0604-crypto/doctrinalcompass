<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doctrinal Compass</title>
<meta name="description" content="A comprehensive review of Christian doctrine, for Christians. Explore what other traditions hold and compare them against your own.">
<meta name="theme-color" content="#faf9f7">
<link rel="canonical" href="https://doctrinalcompass.org/">
<style>
/* Doctrinal Compass — styles.css */

:root {
  --paper: #faf9f7;
  --card:  #ffffff;
  --ink:   #1a1a18;
  --muted: #75736d;
  --rule:  #e4e2dd;
  --sunk:  #f1efea;

  --a: #2f5568;
  --b: #6d4f3c;

  --serif: "Iowan Old Style", Palatino, Georgia, serif;
  --sans:  system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 17px/1.55 var(--serif);
  padding-bottom: calc(70px + env(safe-area-inset-bottom));
}

.wrap { max-width: 620px; margin: 0 auto; padding: 0 16px; }

header.masthead { border-bottom: 1px solid var(--rule); padding: 16px 0; }
.masthead h1 { margin: 0; font: 600 19px/1.2 var(--serif); letter-spacing: -0.01em; }

nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; background: var(--card);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 20;
}

nav.tabs a {
  flex: 1; min-height: 54px;
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--muted);
  font: 500 12px var(--sans); letter-spacing: 0.02em;
  border-top: 2px solid transparent;
}

nav.tabs a[aria-current="page"] { color: var(--ink); border-top-color: var(--ink); }

main { padding: 22px 0 30px; }

h2 { margin: 0 0 8px; font: 600 19px/1.25 var(--serif); }
h3 { margin: 20px 0 6px; font: 600 15px/1.3 var(--serif); }
p  { margin: 0 0 12px; }

.lede { color: var(--muted); font: 400 15px/1.5 var(--sans); }

.eyebrow {
  font: 500 10px/1 var(--mono); letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 7px;
}

.card {
  background: var(--card); border: 1px solid var(--rule);
  border-radius: 8px; padding: 14px; margin-bottom: 12px;
}

button, .btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 48px; padding: 0 16px; margin-bottom: 8px;
  border: 1px solid var(--ink); border-radius: 7px;
  background: var(--ink); color: var(--card);
  font: 500 15px var(--sans); text-decoration: none; cursor: pointer;
}

.btn.ghost, button.ghost { background: transparent; color: var(--ink); }
button.small, .btn.small { min-height: 40px; font-size: 13px; width: auto; }
button:focus-visible, a:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--a); outline-offset: 2px;
}

.row { display: flex; gap: 8px; }
.row > * { flex: 1; margin-bottom: 0; }

select, textarea {
  width: 100%; min-height: 46px; padding: 9px 11px;
  border: 1px solid var(--rule); border-radius: 7px;
  background: var(--card); color: var(--ink); font: 400 15px var(--sans);
}

textarea { min-height: 84px; font: 400 12px/1.5 var(--mono); word-break: break-all; }

/* glossary */
.term { border: 0; background: none; padding: 0; margin: 0; min-height: 0; width: auto;
        display: inline; font: inherit; color: inherit;
        border-bottom: 1px dotted var(--muted); cursor: pointer; }
.term::after { content: "\00a0?"; font: 500 9px var(--mono); vertical-align: super; color: var(--muted); }

dialog.glossary {
  border: 1px solid var(--rule); border-radius: 10px; padding: 16px;
  max-width: 400px; width: calc(100% - 32px); background: var(--card); color: var(--ink);
}
dialog.glossary::backdrop { background: rgba(26,26,24,0.35); }
dialog.glossary h4 { margin: 0 0 6px; font: 600 16px var(--serif); }
dialog.glossary p { font: 400 15px/1.5 var(--sans); }

/* authority bars */
.auth { margin: 10px 0 14px; }
.auth-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.auth-row .k { flex: 0 0 96px; font: 500 11px var(--mono); letter-spacing: 0.04em;
               text-transform: uppercase; color: var(--muted); }
.auth-row .bar { flex: 1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.auth-row .bar i { display: block; height: 100%; background: var(--muted); border-radius: 3px; }
.auth-row.a .bar i { background: var(--a); }
.auth-row.b .bar i { background: var(--b); }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-bottom: 1px solid var(--rule); }
.list button {
  width: 100%; min-height: 58px; margin: 0; padding: 11px 0;
  border: 0; border-radius: 0; background: none; color: var(--ink);
  flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
}
.list .name { font: 600 16px var(--serif); }
.list .locus { font: 400 12px var(--sans); color: var(--muted); }
.list .agree { font: 500 11px var(--mono); color: var(--muted); }

/* positions */
.axis-block { border-top: 1px solid var(--rule); padding-top: 14px; margin-top: 14px; }
.axis-block h3 { margin-top: 0; }
.axis-q { font: 400 13px/1.45 var(--sans); color: var(--muted); margin-bottom: 12px; }

.position { border-left: 3px solid var(--rule); padding-left: 11px; margin-bottom: 13px; }
.position.a { border-left-color: var(--a); }
.position.b { border-left-color: var(--b); }
.position .who { font: 600 12px var(--sans); margin-bottom: 3px; }
.position .what { margin: 0 0 7px; font-size: 16px; }
.position .why { margin: 0; font: 400 15px/1.5 var(--serif);
                 background: var(--sunk); padding: 9px 11px; border-radius: 5px; }
.position .why b { display: block; font: 500 9px/1 var(--mono); letter-spacing: 0.08em;
                   text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }

.refs { margin-top: 6px; font: 400 11px/1.5 var(--mono); color: var(--muted); }
.refs span { display: block; }

.note { font: 400 12px/1.45 var(--sans); color: var(--muted);
        background: var(--sunk); border-radius: 5px; padding: 8px 10px; margin-bottom: 12px; }

.verify { display: inline-block; font: 600 9px/1 var(--mono); letter-spacing: 0.08em;
          color: #8a6d1f; border: 1px solid #8a6d1f; border-radius: 3px; padding: 2px 3px; }

.unwritten { font: 400 13px var(--sans); color: var(--muted);
             background: var(--sunk); border-radius: 5px; padding: 10px; margin: 0; }

/* seats */
.seats { display: flex; gap: 8px; margin-bottom: 14px; }
.seats > div { flex: 1; min-width: 0; }
.seat-label { font: 500 10px/1 var(--mono); letter-spacing: 0.08em;
              text-transform: uppercase; margin-bottom: 5px; }
.seat-label.a { color: var(--a); }
.seat-label.b { color: var(--b); }

/* test */
.progress { font: 500 10px var(--mono); letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
.ptrack { height: 2px; background: var(--rule); margin-bottom: 18px; }
.ptrack span { display: block; height: 100%; background: var(--ink); }

.choice {
  min-height: 54px; padding: 13px; margin-bottom: 7px;
  border: 1px solid var(--rule); border-radius: 7px;
  background: var(--card); color: var(--ink);
  font: 400 16px/1.4 var(--serif); justify-content: flex-start; text-align: left;
}

/* result / agreeability */
.score { font: 600 34px/1 var(--serif); margin: 2px 0 2px; }
.score-sub { font: 400 13px var(--sans); color: var(--muted); margin-bottom: 16px; }
.diverge { border-top: 1px solid var(--rule); padding: 12px 0; }
.diverge .k { font: 500 10px var(--mono); letter-spacing: 0.08em;
              text-transform: uppercase; color: var(--muted); }
.diverge p { margin: 3px 0 8px; font-size: 15px; }

.locked { text-align: center; padding: 30px 0; }
.locked p { font: 400 15px var(--sans); color: var(--muted); }

.footnote { font: 400 11px/1.45 var(--sans); color: var(--muted); margin-top: 18px; }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (min-width: 600px) { body { font-size: 18px; } }

</style>
</head>

<script>
/* ============================================================
   ==                                                        ==
   ==   E D I T   B E L O W   T H I S   L I N E              ==
   ==                                                        ==
   ==   Everything you add to the site lives in this block:  ==
   ==   glossary terms, axes, traditions, positions, and     ==
   ==   the assessment questions.                            ==
   ==                                                        ==
   ==   Rules that keep the site honest:                     ==
   ==   - State each position in its own words.              ==
   ==   - `why` is the reasoning from INSIDE that tradition. ==
   ==   - `texts` are scripture ADDRESSES, never quotations. ==
   ==   - Leave verify:true until YOU have read the source.  ==
   ==   - Keep entries a similar length across traditions.   ==
   ==                                                        ==
   ==   Every comma, quote and brace matters. If the site    ==
   ==   goes blank after an edit, you dropped one — use      ==
   ==   GitHub's History to revert the last commit.          ==
   ==                                                        ==
   ============================================================ */

/* Doctrinal Compass — content.js
 *
 * THIS IS THE ONLY FILE YOU EDIT TO ADD CONTENT.
 * Every page on the site renders from this data, so a tradition page, an axis
 * page and the comparison view can never drift out of sync with each other.
 *
 * Editing rules, so the site keeps its promise:
 *   1. `what` states the position in the tradition's own terms. Never in the
 *      terms of its critics.
 *   2. `why` is the reasoning FROM INSIDE. It answers "why would a thoughtful
 *      person hold this", not "what's wrong with this".
 *   3. `texts` are scripture ADDRESSES, never quotations. A reference is
 *      checkable; a quotation typed from memory is how sites like this die.
 *   4. `sources` point at primary documents. Anything not personally checked
 *      against the document keeps verify:true, which prints a VERIFY badge.
 *      Set verify:false only after YOU have read it in the source.
 *   5. Keep `what` roughly the same length across traditions on a given axis.
 *      Unequal length is the most visible bias there is.
 */

window.DATA = (function () {
  'use strict';

  /* ================= GLOSSARY ================= */
  /* Tap any <span data-term="id"> in the copy to open these. */

  var glossary = {
    'sola-scriptura': {
      term: 'Sola scriptura',
      body: 'Scripture is the only infallible rule of faith. Creeds, councils and confessions still carry real authority, but they are subordinate and can in principle be corrected by Scripture.',
      also: 'Latin: "by Scripture alone." Often confused with solo scriptura.'
    },
    'solo-scriptura': {
      term: 'Solo scriptura',
      body: 'Scripture is the only authority at all, with no binding role for creed, council or church. The individual reader stands directly before the text.',
      also: 'A distinct position from sola scriptura, though the two are often blurred together.'
    },
    'prima-scriptura': {
      term: 'Prima scriptura',
      body: 'Scripture is supreme, but tradition, reason and experience are genuine subordinate authorities rather than merely useful tools.',
      also: 'Latin: "Scripture first."'
    },
    'magisterium': {
      term: 'Magisterium',
      body: 'The teaching office of the Catholic Church — the bishops in communion with the Bishop of Rome — charged with authentically interpreting the Word of God.',
      also: 'Catholic teaching holds that the Magisterium serves the Word of God and is not above it.'
    },
    'sacred-tradition': {
      term: 'Sacred Tradition',
      body: 'The apostolic preaching handed on in the life of the Church. In Catholic and Orthodox teaching this is not a second body of facts added to the Bible, but the same deposit transmitted in a second mode.',
      also: 'Distinguish from "traditions" (lowercase) meaning local customs, which both communions agree can change.'
    },
    'norma-normans': {
      term: 'Norma normans / norma normata',
      body: 'The "norming norm" and the "normed norm." Scripture norms everything else; the creeds and confessions are themselves normed by Scripture, and are authoritative because and insofar as they agree with it.',
      also: 'Standard Lutheran vocabulary for how confessions can be binding without rivalling Scripture.'
    },
    'deuterocanon': {
      term: 'Deuterocanonical books',
      body: 'Books including Tobit, Judith, Wisdom, Sirach, Baruch and 1–2 Maccabees, plus additions to Esther and Daniel. Catholics and Orthodox receive them as Scripture; Protestants classify them as Apocrypha and exclude them from the canon.',
      also: 'Greek-derived term meaning "second canon" — second in the order they were settled, not second in authority.'
    },
    'anagignoskomena': {
      term: 'Anagignoskomena',
      body: 'Greek for "those which are read." The Orthodox term for the books beyond the Protestant Old Testament that are read in the Church, received as Scripture though sometimes distinguished in rank.',
      also: 'Orthodox canon lists vary somewhat between local churches.'
    },
    'material-sufficiency': {
      term: 'Material vs. formal sufficiency',
      body: 'Material sufficiency: everything necessary for salvation is contained in Scripture. Formal sufficiency: Scripture is also clear enough to be rightly interpreted without an external interpreting authority. Some traditions affirm the first and deny the second.',
      also: 'This distinction resolves many arguments that otherwise talk past each other.'
    },
    'perspicuity': {
      term: 'Perspicuity of Scripture',
      body: 'The teaching that what is necessary for salvation is clear enough in Scripture that an ordinary reader, with ordinary means, can grasp it.',
      also: 'Not a claim that every passage is easy.'
    },
    'adiaphora': {
      term: 'Adiaphora',
      body: 'Matters "indifferent" — practices neither commanded nor forbidden by Scripture, on which the church may legitimately decide for good order.',
      also: 'Where a tradition draws this line largely determines how much freedom it allows.'
    },
    'ceni': {
      term: 'CENI',
      body: 'Command, Example and Necessary Inference — a hermeneutic that authorises a practice only if Scripture commands it, shows an approved example of it, or necessarily implies it.',
      also: 'Paired with the "law of silence": where Scripture does not speak, neither do we.'
    },
    'regulative-principle': {
      term: 'Regulative principle of worship',
      body: 'Worship may include only what Scripture positively commands. Contrast the normative principle, which permits whatever Scripture does not forbid.',
      also: 'The same two traditions can share a doctrine of Scripture and still worship very differently because of this.'
    },
    'apostolic-succession': {
      term: 'Apostolic succession',
      body: 'The continuity of ordained ministry, traced through the laying on of hands from the apostles, understood as guarding the continuity of apostolic teaching.',
      also: 'Held by Catholic, Orthodox and Anglican bodies, understood differently in each.'
    },
    'ecumenical-council': {
      term: 'Ecumenical council',
      body: 'A council understood to speak for the whole Church. The first seven, from Nicaea in 325 to Nicaea II in 787, are received by both Catholic and Orthodox Christians.',
      also: 'Rome counts later councils as ecumenical; the Orthodox do not.'
    },
    'homoousios': {
      term: 'Homoousios',
      body: 'Greek for "of the same substance." The Nicene term stating that the Son is of the same being as the Father, not merely similar to him.',
      also: 'This single word is the historic dividing line on the nature of God.'
    },
    'filioque': {
      term: 'Filioque',
      body: 'Latin for "and the Son." The Western addition to the Nicene Creed stating that the Spirit proceeds from the Father and the Son. The East holds the Spirit proceeds from the Father.',
      also: 'A disagreement about the creed itself and about who may amend it.'
    },
    'modalism': {
      term: 'Modalism',
      body: 'The view that Father, Son and Spirit are not three distinct persons but three modes, roles or manifestations of one single person.',
      also: 'Groups described this way by others often reject the label and prefer their own terms.'
    },
    'subordinationism': {
      term: 'Subordinationism',
      body: 'The view that the Son, and often the Spirit, are lesser in being than the Father rather than equal in nature.',
      also: 'Distinguish from functional subordination, which many Trinitarians affirm within an equality of being.'
    },
    'continuing-revelation': {
      term: 'Continuing revelation',
      body: 'The teaching that God still gives authoritative revelation beyond the biblical canon, whether through a living prophet, a governing body, or direct illumination.',
      also: 'The canon question and this question are separate: a group can hold a closed canon and still expect ongoing guidance.'
    },
    'inner-light': {
      term: 'Inner Light',
      body: 'The Quaker term for the immediate presence of Christ teaching the individual and the gathered meeting directly, without an intermediary.',
      also: 'Also called the Inward Light or "that of God in everyone."'
    },
    'inerrancy': {
      term: 'Inerrancy',
      body: 'The teaching that Scripture, in its original manuscripts, does not err in what it affirms. Distinguished by its own defenders from a wooden literalism.',
      also: 'Held most explicitly by conservative evangelical bodies; other traditions prefer "infallible in matters of faith and practice."'
    }
  };

  /* ================= AXES ================= */

  var axes = [
    {
      id: 'authority',
      name: 'Where authority sits',
      question: 'When Christians disagree about what is true, what settles it? This is the deepest division on the site, and most other disagreements run downstream of it.',
      written: true,
      spectrum: { left: 'The text alone', right: 'A living voice' }
    },
    {
      id: 'canon',
      name: 'Which books count',
      question: 'Before you can ask what Scripture teaches, you have to know what Scripture is. Which books belong, and is the list closed?',
      written: true
    },
    {
      id: 'godhead',
      name: 'The nature of God',
      question: 'Is God three distinct persons in one being, one person in three modes, or three distinct beings united in purpose? The historic creeds answer one way; several modern groups answer differently.',
      written: true
    },
    { id: 'baptism',  name: 'Baptism',            question: 'Who is baptised, by what mode, and what does the act accomplish?', written: false },
    { id: 'supper',   name: "The Lord's Supper",  question: 'In what sense, if any, is Christ present in the bread and cup?', written: false },
    { id: 'salvation',name: 'Salvation and election', question: 'How is a person justified, and what part do God and the human will each play?', written: false },
    { id: 'governance', name: 'Church governance', question: 'Who decides, and by what right? Bishops, elders, the congregation, or a central body?', written: false }
  ];

  /* ================= TRADITIONS ================= */
  /* `locus` is the one-line answer to "where does authority sit". */
  /* `auth` weights that answer 0–5 across four places authority can be put:  */
  /*   s = scripture, c = the church / a teaching office,                     */
  /*   t = tradition, r = direct or continuing revelation.                    */
  /* These are relative weights, not scores. Nothing here ranks traditions.   */

  var AUTH_KEYS = [
    { k: 's', label: 'Scripture' },
    { k: 'c', label: 'Church' },
    { k: 't', label: 'Tradition' },
    { k: 'r', label: 'Direct revelation' }
  ];

  var traditions = [
    { id: 'restoration', name: 'Churches of Christ', family: 'Restoration Movement', locus: 'Scripture alone, no creeds', auth: { s: 5, c: 0, t: 0, r: 0 } },
    { id: 'baptist',     name: 'Baptist',            family: 'Free Church',          locus: 'Scripture alone; confessions advisory', auth: { s: 5, c: 1, t: 0, r: 0 } },
    { id: 'nondenom',    name: 'Non-denominational evangelical', family: 'Evangelical', locus: 'Scripture alone; little formal tradition', auth: { s: 5, c: 1, t: 0, r: 0 } },
    { id: 'reformed',    name: 'Reformed / Presbyterian', family: 'Magisterial Reformation', locus: 'Scripture alone; confessions subordinate', auth: { s: 5, c: 1, t: 1, r: 0 } },
    { id: 'lutheran',    name: 'Lutheran',           family: 'Magisterial Reformation', locus: 'Scripture norms the confessions', auth: { s: 5, c: 1, t: 2, r: 0 } },
    { id: 'oneness',     name: 'Oneness Pentecostal', family: 'Pentecostal',          locus: 'Scripture alone, read through the apostolic pattern', auth: { s: 5, c: 1, t: 0, r: 1 } },
    { id: 'adventist',   name: 'Seventh-day Adventist', family: 'Adventist',          locus: 'Scripture the standard; a prophetic gift under it', auth: { s: 5, c: 1, t: 0, r: 3 } },
    { id: 'anabaptist',  name: 'Anabaptist / Mennonite', family: 'Radical Reformation', locus: 'Scripture read by the gathered congregation', auth: { s: 5, c: 3, t: 1, r: 1 } },
    { id: 'pentecostal', name: 'Pentecostal',        family: 'Pentecostal',           locus: 'Scripture first; the Spirit still speaks under it', auth: { s: 4, c: 1, t: 1, r: 3 } },
    { id: 'methodist',   name: 'Methodist / Wesleyan', family: 'Wesleyan',            locus: 'Scripture first; tradition, reason, experience follow', auth: { s: 4, c: 2, t: 3, r: 2 } },
    { id: 'anglican',    name: 'Anglican / Episcopal', family: 'English Reformation', locus: 'Scripture supreme; tradition and reason under it', auth: { s: 4, c: 3, t: 3, r: 0 } },
    { id: 'jw',          name: "Jehovah's Witnesses", family: 'Bible Student movement', locus: 'Scripture, interpreted by the Governing Body', auth: { s: 4, c: 5, t: 0, r: 1 } },
    { id: 'orthodox',    name: 'Eastern Orthodox',   family: 'Eastern Christianity',  locus: 'Scripture within Holy Tradition', auth: { s: 3, c: 4, t: 5, r: 0 } },
    { id: 'catholic',    name: 'Roman Catholic',     family: 'Western Catholicism',   locus: 'Scripture and Tradition, read by the Magisterium', auth: { s: 3, c: 5, t: 5, r: 0 } },
    { id: 'lds',         name: 'Latter-day Saints',  family: 'Latter Day Saint movement', locus: 'Open canon and living prophets', auth: { s: 3, c: 5, t: 1, r: 5 } },
    { id: 'quaker',      name: 'Quaker (Friends)',   family: 'Radical Reformation',   locus: 'The Spirit speaking directly; Scripture secondary', auth: { s: 2, c: 2, t: 1, r: 5 } }
  ];

  /* ================= POSITIONS ================= */
  /* Key format: "traditionId:axisId" */

  var P = {};

  function set(trad, axis, obj) { P[trad + ':' + axis] = obj; }

  /* ---------- AXIS: authority ---------- */

  set('catholic', 'authority', {
    what: 'Scripture and <span data-term="sacred-tradition">Sacred Tradition</span> are two modes of transmitting one deposit of revelation, and the <span data-term="magisterium">Magisterium</span> is charged with interpreting it authentically. Catholic teaching describes the teaching office as serving the Word of God, not standing above it.',
    why: 'The Church existed and preached before a single New Testament book was written, and it was the Church that recognised which books were apostolic. On this reading, a Bible detached from the community that produced and canonised it has no way to settle disputed readings, and the history of division is taken as evidence of that.',
    texts: ['2 Thessalonians 2:15', '1 Timothy 3:15', 'Matthew 16:18–19', 'Acts 15:1–29'],
    sources: [
      { ref: 'Dei Verbum 9–10 (Second Vatican Council, 1965)', verify: true },
      { ref: 'Catechism of the Catholic Church 80–87', verify: true }
    ],
    caution: 'Frequently caricatured as "the Bible plus extra rules." That is a two-source theory the Church itself rejected in the drafting of Dei Verbum. State it as one source in two modes.'
  });

  set('orthodox', 'authority', {
    what: 'Scripture exists <em>within</em> Holy Tradition rather than alongside it. Tradition is the whole life of the Spirit in the Church — Scripture, the seven <span data-term="ecumenical-council">ecumenical councils</span>, the Fathers, the liturgy and the icons — and Scripture is the Church\'s own book, read inside that life.',
    why: 'If the Church, guided by the Spirit, is what recognised the canon, then the Church\'s continuing mind is the natural context for reading it. Orthodoxy resists locating final authority in any single office, holding instead that the whole body of the faithful guards the faith, which is why a council is received as true rather than true by decree.',

        { label: 'No — God may yet add to it', t: ['lds'] }
      ]
    },
    {

      axis: 'godhead',
      text: 'What is the relationship between Father, Son and Spirit?',
      options: [
        { label: 'Three coequal persons in one being', t: ['catholic','orthodox','lutheran','reformed','anglican','baptist','methodist','anabaptist','restoration','pentecostal','nondenom','quaker','adventist'] },
        { label: 'One person revealed in three modes or manifestations', t: ['oneness'] },
        { label: 'Three distinct beings, perfectly united in purpose', t: ['lds'] },
        { label: 'The Father alone is God; the Son is his created agent', t: ['jw'] }
      ]
    },
    {
      id: 'q-god-christ',
      axis: 'godhead',
      text: 'What is Christ in relation to the Father?',
      options: [
        { label: 'Eternally begotten, of the same being as the Father', t: ['catholic','orthodox','lutheran','reformed','anglican','baptist','methodist','anabaptist','restoration','pentecostal','nondenom','quaker','adventist'] },
        { label: 'The one God himself, in human flesh', t: ['oneness'] },
        { label: 'A distinct divine being, subordinate to the Father in his beginning', t: ['lds'] },
        { label: 'The first and only direct creation of God', t: ['jw'] }
      ]

  ];

  return {
    glossary: glossary,
    axes: axes,
    traditions: traditions,
    authKeys: AUTH_KEYS,
    positions: P,
    questions: questions
  };
})();

</script>

<script>
/* ============================================================
   ==                                                        ==
   ==   E N G I N E  -  d o   n o t   e d i t                ==
   ==                                                        ==
   ==   Save codes, rendering, routing, scoring.             ==
   ==   Nothing below needs changing to add content.         ==
   ==                                                        ==

/* Save codes: object -> JSON -> deflate -> base64url, and back. */

(function (global) {
  'use strict';

  var FORMAT = 1;          // bump only if the byte layout itself changes
  var FLAG_COMPRESSED = 1; // bit 0 of the flags byte

  /* ---------- errors ---------------------------------------------------- */

  // Thrown for every bad-code case, so your UI can catch one type and show
  // err.message directly to the user. Messages are written to be read.
  function SaveCodeError(message) {
    this.name = 'SaveCodeError';
    this.message = message;
  }
  SaveCodeError.prototype = Object.create(Error.prototype);
  SaveCodeError.prototype.constructor = SaveCodeError;

  /* ---------- base64url -------------------------------------------------- */
  /* Standard base64 uses + / = which get mangled in URLs and look like typos.
     base64url swaps them for - _ and drops the padding. */

  function bytesToBase64Url(bytes) {
    var bin = '';
    var CHUNK = 0x8000; // apply() has an argument-count ceiling; chunk to stay under it
    for (var i = 0; i < bytes.length; i += CHUNK) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function base64UrlToBytes(text) {
    var b64 = text.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '='; // restore padding atob may want
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  /* ---------- checksum --------------------------------------------------- */
  /* FNV-1a, truncated to 16 bits. Not security — it catches a dropped or
     swapped character so the user gets "that code looks incomplete" instead
     of a half-restored quiz. */

  function checksum16(bytes) {
    var h = 0x811c9dc5;
    for (var i = 0; i < bytes.length; i++) {
      h ^= bytes[i];
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h & 0xffff;
  }

  /* ---------- compression ------------------------------------------------ */
  /* CompressionStream is built into the browser — no library needed.
     'deflate-raw' omits the gzip header, which saves ~18 bytes.
     If it is missing (very old browser), we store the JSON uncompressed and
     record that in the flags byte, so decoding still works either way. */

  var canCompress = typeof global.CompressionStream === 'function' &&
                    typeof global.DecompressionStream === 'function';

  function streamThrough(bytes, transform) {
    var stream = new Blob([bytes]).stream().pipeThrough(transform);
    return new Response(stream).arrayBuffer().then(function (buf) {
      return new Uint8Array(buf);
    });
  }

  function deflate(bytes) {
    return streamThrough(bytes, new global.CompressionStream('deflate-raw'));
  }

  function inflate(bytes) {
    return streamThrough(bytes, new global.DecompressionStream('deflate-raw'));
  }

  /* ---------- encode ----------------------------------------------------- */

  /**
   * Turn a plain object into a save code.
   * Async because the browser's compressor is stream-based.
   *
   *   var code = await createSaveCode({ v: 1, answers: '31042...' });
   */
  function createSaveCode(data) {
    var raw;
    try {
      raw = new TextEncoder().encode(JSON.stringify(data));
    } catch (e) {
      return Promise.reject(new SaveCodeError('That data could not be turned into a code.'));
    }

    var packed = canCompress
      ? deflate(raw).catch(function () { return null; })
      : Promise.resolve(null);

    return packed.then(function (body) {
      var flags = 0;
      // Compression can make tiny payloads bigger. Keep whichever won.
      if (body && body.length < raw.length) {
        flags |= FLAG_COMPRESSED;
      } else {
        body = raw;
      }

      var sum = checksum16(body);
      var out = new Uint8Array(4 + body.length);
      out[0] = FORMAT;
      out[1] = flags;
      out[2] = (sum >> 8) & 0xff;
      out[3] = sum & 0xff;
      out.set(body, 4);

      return bytesToBase64Url(out);
    });
  }

  /* ---------- decode ----------------------------------------------------- */

  /**
   * Turn a save code back into the original object.
   * Rejects with a SaveCodeError carrying a message you can show as-is.
   *
   *   try { state = await readSaveCode(input.value); }
   *   catch (err) { showError(err.message); }
   */
  function readSaveCode(code) {
    return Promise.resolve().then(function () {
      // Users paste with stray spaces and line breaks. Strip them first.
      var cleaned = String(code == null ? '' : code).replace(/\s+/g, '');
      if (!cleaned) throw new SaveCodeError('Paste a save code first.');

      var bytes;
      try {
        bytes = base64UrlToBytes(cleaned);
      } catch (e) {
        throw new SaveCodeError('That does not look like a save code.');
      }
      if (bytes.length < 5) throw new SaveCodeError('That save code is incomplete.');

      var version = bytes[0];
      if (version > FORMAT) {
        throw new SaveCodeError('That code came from a newer version of this site.');
      }

      var flags = bytes[1];
      var expected = (bytes[2] << 8) | bytes[3];
      var body = bytes.subarray(4);

      if (checksum16(body) !== expected) {
        throw new SaveCodeError('That save code looks mistyped or incomplete.');
      }

      if (!(flags & FLAG_COMPRESSED)) return body;
      if (!canCompress) {
        throw new SaveCodeError('This browser cannot read compressed save codes.');
      }
      return inflate(body).catch(function () {
        throw new SaveCodeError('That save code could not be read.');
      });
    }).then(function (raw) {
      var text = new TextDecoder().decode(raw);
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new SaveCodeError('That save code could not be read.');
      }
    });
  }

  /* ---------- localStorage ----------------------------------------------- */
  /* Every call is wrapped: localStorage throws in some private-browsing modes
     and when the origin's quota is full. A site that cannot remember state is
     annoying; a site that crashes because it cannot remember state is broken. */

  var STORAGE_KEY = 'cdt:state:v1';

  function saveLocal(state) {
    try {
      global.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      return false;
    }
  }

  function loadLocal() {
    try {
      var text = global.localStorage.getItem(STORAGE_KEY);
      return text ? JSON.parse(text) : null;
    } catch (e) {
      return null; // corrupt or unreadable: treat as no saved state
    }
  }

  function clearLocal() {
    try {
      global.localStorage.removeItem(STORAGE_KEY);
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ---------- exports ---------------------------------------------------- */

  global.SaveCode = {
    create: createSaveCode,
    read: readSaveCode,
    saveLocal: saveLocal,
    loadLocal: loadLocal,
    clearLocal: clearLocal,
    Error: SaveCodeError,
    STORAGE_KEY: STORAGE_KEY,
    canCompress: canCompress
  };
})(typeof window !== 'undefined' ? window : this);


/* Doctrinal Compass — app.js
 * Renders every view from content.js. Add content there, not here.
 */

(function () {
  'use strict';

  var D = window.DATA;
  var app = document.getElementById('app');
  var dlg = document.getElementById('glossary-dialog');

  var answers = [];
  var step = 0;

  /* ---------- helpers ---------- */

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function trad(id) { return byId(D.traditions, id); }
  function axis(id) { return byId(D.axes, id); }
  function pos(t, a) { return D.positions[t + ':' + a] || null; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function go(h) { location.hash = h; }

  function resetTest() {
    answers = D.questions.map(function () { return -1; });
    step = 0;
  }

  function taken() {
    for (var i = 0; i < answers.length; i++) if (answers[i] >= 0) return true;
    return false;
  }

  /* Agreeability: of the questions you answered, how many match this tradition. */
  function agree(tId) {
    var m = 0, n = 0;
    D.questions.forEach(function (q, i) {
      if (answers[i] < 0) return;
      n++;
      if (q.options[answers[i]].t.indexOf(tId) !== -1) m++;
    });
    return { matched: m, answered: n, pct: n ? Math.round(m / n * 100) : 0 };
  }

  function best() {
    var top = null, topScore = -1;
    D.traditions.forEach(function (t) {
      var s = agree(t.id).matched;
      if (s > topScore) { topScore = s; top = t.id; }
    });
    return top;
  }

  /* ---------- glossary ---------- */

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-term]');
    if (!el) return;
    var g = D.glossary[el.getAttribute('data-term')];
    if (!g) return;
    dlg.innerHTML = '<h4>' + esc(g.term) + '</h4><p>' + g.body + '</p>' +
                    '<button class="ghost small" data-close>Close</button>';
    dlg.showModal();
  });

  dlg.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close') || e.target === dlg) dlg.close();
  });

  function wireTerms(root) {
    root.querySelectorAll('[data-term]').forEach(function (el) {
      el.className = 'term';
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); el.click(); }
      });
    });
  }

  /* ---------- fragments ---------- */

  function authBars(t, seat) {
    return '<div class="auth">' + D.authKeys.map(function (k) {
      var v = (t.auth[k.k] || 0) / 5 * 100;
      return '<div class="auth-row' + (seat ? ' ' + seat : '') + '">' +
             '<span class="k">' + esc(k.label) + '</span>' +
             '<span class="bar"><i style="width:' + v + '%"></i></span></div>';
    }).join('') + '</div>';
  }

  function positionBlock(tId, aId, seat) {
    var t = trad(tId), p = pos(tId, aId);
    var cls = 'position' + (seat ? ' ' + seat : '');
    if (!p) {
      return '<div class="' + cls + '"><div class="who">' + esc(t.name) + '</div>' +
             '<p class="unwritten">Not written yet.</p></div>';
    }
    var h = '<div class="' + cls + '"><div class="who">' + esc(t.name) + '</div>';
    h += '<p class="what">' + p.what + '</p>';
    h += '<p class="why"><b>Why they hold it</b>' + p.why + '</p>';
    if (p.texts && p.texts.length) h += '<div class="refs"><span>' + p.texts.map(esc).join(' &middot; ') + '</span></div>';
    if (p.sources && p.sources.length) {
      h += '<div class="refs">' + p.sources.map(function (s) {
        return '<span>' + esc(s.ref) + (s.verify ? ' <span class="verify">VERIFY</span>' : '') + '</span>';
      }).join('') + '</div>';
    }
    if (p.caution) h += '<div class="note" style="margin-top:7px">' + p.caution + '</div>';
    return h + '</div>';
  }

  /* ---------- views ---------- */

  function viewHome() {
    return '<h2>A comprehensive review of Christian doctrine, for Christians.</h2>' +
      '<p class="lede">Explore what other traditions hold. Compare them against your own.</p>' +
      '<div style="margin-top:20px">' +
        '<a class="btn" href="#/explore">Explore</a>' +
        '<a class="btn ghost" href="#/compare">Compare</a>' +
        '<a class="btn ghost" href="#/test">' + (taken() ? 'Retake the assessment' : 'Take the assessment') + '</a>' +
      '</div>';
  }

  function viewExplore() {
    var has = taken();
    var list = D.traditions.slice();
    if (has) list.sort(function (x, y) { return agree(y.id).pct - agree(x.id).pct; });

    return '<p class="eyebrow">Explore</p>' +
      '<h2>Sixteen traditions</h2>' +
      '<p class="lede">' + (has
        ? 'Ordered by how much you agreed with each.'
        : 'Read any of them. Take the assessment to see an agreeability score here.') + '</p>' +
      '<ul class="list">' + list.map(function (t) {
        var a = has ? agree(t.id) : null;
        return '<li><button onclick="location.hash=\'#/tradition/' + t.id + '\'">' +
          '<span class="name">' + esc(t.name) + '</span>' +
          '<span class="locus">' + esc(t.locus) + '</span>' +
          (a ? '<span class="agree">' + a.pct + '% agreeable</span>' : '') +
          '</button></li>';
      }).join('') + '</ul>';
  }

  function viewTradition(id) {
    var t = trad(id);
    if (!t) return viewExplore();
    var h = '<p class="eyebrow">' + esc(t.family) + '</p><h2>' + esc(t.name) + '</h2>';

    if (taken()) {
      var a = agree(t.id);
      h += '<div class="score">' + a.pct + '%</div>' +
           '<p class="score-sub">agreeable — you matched ' + a.matched + ' of ' + a.answered + ' answered questions.</p>';
    }

    h += '<p class="eyebrow">Where it puts authority</p>' + authBars(t);
    h += '<p class="lede">' + esc(t.locus) + '</p>';

    D.axes.forEach(function (ax) {
      h += '<div class="axis-block"><h3>' + esc(ax.name) + '</h3>' +
           positionBlock(t.id, ax.id, 'a') + '</div>';
    });
    return h + '<div style="margin-top:18px"><a class="btn ghost" href="#/compare?a=' + t.id + '">Compare</a></div>';
  }

  function viewCompare(q) {
    if (!taken()) {
      return '<div class="locked">' +
        '<h2>Take the assessment first</h2>' +
        '<p>Comparison shows how each tradition lines up against your own answers.</p>' +
        '<div style="margin-top:18px"><a class="btn" href="#/test">Take the assessment</a>' +
        '<a class="btn ghost" href="#/explore">Explore without it</a></div></div>';
    }

    var aId = q.a || best();
    var bId = q.b || (aId === 'catholic' ? 'reformed' : 'catholic');
    if (aId === bId) bId = aId === 'reformed' ? 'catholic' : 'reformed';
    var ta = trad(aId), tb = trad(bId);

    function sel(seat, cur) {
      return '<select data-seat="' + seat + '">' + D.traditions.map(function (t) {
        return '<option value="' + t.id + '"' + (t.id === cur ? ' selected' : '') + '>' + esc(t.name) + '</option>';
      }).join('') + '</select>';
    }

    var h = '<p class="eyebrow">Compare</p>' +
      '<div class="seats">' +
        '<div><div class="seat-label a">A</div>' + sel('a', aId) + '</div>' +
        '<div><div class="seat-label b">B</div>' + sel('b', bId) + '</div>' +
      '</div>';

    h += '<p class="eyebrow">You agree with</p>' +
         '<p class="lede">' + esc(ta.name) + ' ' + agree(aId).pct + '% &middot; ' +
         esc(tb.name) + ' ' + agree(bId).pct + '%</p>';

    h += '<p class="eyebrow">Where each puts authority</p>' +
         authBars(ta, 'a') + authBars(tb, 'b');

    D.axes.forEach(function (ax) {
      h += '<div class="axis-block"><h3>' + esc(ax.name) + '</h3>' +
           positionBlock(aId, ax.id, 'a') + positionBlock(bId, ax.id, 'b') + '</div>';
    });
    return h;
  }

  function viewTest() {
    if (!answers.length) resetTest();
    if (step >= D.questions.length) { go('#/result'); return ''; }
    var q = D.questions[step];

    return '<div class="progress">' + (step + 1) + ' / ' + D.questions.length + '</div>' +
      '<div class="ptrack"><span style="width:' + Math.round(step / D.questions.length * 100) + '%"></span></div>' +
      '<h2>' + esc(q.text) + '</h2>' +
      q.options.map(function (o, i) {
        return '<button class="choice" data-answer="' + i + '">' + esc(o.label) + '</button>';
      }).join('') +
      '<div class="row" style="margin-top:12px">' +
        (step > 0 ? '<button class="ghost small" data-back>Back</button>' : '') +
        '<button class="ghost small" data-skip>Skip</button></div>';
  }

  function viewResult() {
    if (!taken()) return '<h2>Nothing answered yet.</h2><a class="btn" href="#/test">Take the assessment</a>';

    var bId = best(), bt = trad(bId), a = agree(bId);
    var h = '<p class="eyebrow">Closest match</p><h2>' + esc(bt.name) + '</h2>' +
            '<div class="score">' + a.pct + '%</div>' +
            '<p class="score-sub">agreeable — ' + a.matched + ' of ' + a.answered + ' answered questions.</p>';

    var diff = [];
    D.questions.forEach(function (q, i) {
      if (answers[i] < 0) return;
      if (q.options[answers[i]].t.indexOf(bId) === -1) diff.push({ q: q, i: i });
    });

    if (diff.length) {
      h += '<h3>Where you differ</h3>';
      diff.forEach(function (d) {
        var theirs = null;
        d.q.options.forEach(function (o) { if (o.t.indexOf(bId) !== -1) theirs = o; });
        var also = d.q.options[answers[d.i]].t.map(function (id) {
          var t = trad(id); return t ? t.name : null;
        }).filter(Boolean);

        h += '<div class="diverge">' +
          '<span class="k">You</span><p>' + esc(d.q.options[answers[d.i]].label) + '</p>' +
          (theirs ? '<span class="k">' + esc(bt.name) + '</span><p>' + esc(theirs.label) + '</p>' : '') +
          (also.length ? '<span class="k">Also answering this way</span><p class="lede">' + also.map(esc).join(', ') + '</p>' : '') +
          '</div>';
      });
    }

    h += '<h3>Save code</h3>' +
      '<p class="lede">Nothing is stored on a server. This code holds your answers.</p>' +
      '<textarea id="code-out" readonly></textarea>' +
      '<div class="row"><button class="small" id="copy-code">Copy</button>' +
      '<button class="ghost small" id="clear-code">Clear</button></div>' +
      '<textarea id="code-in" placeholder="Paste a save code to restore" style="margin-top:12px"></textarea>' +
      '<div class="row"><button class="ghost small" id="load-code">Restore</button></div>' +
      '<p class="footnote" id="code-msg" hidden></p>' +
      '<div style="margin-top:16px"><a class="btn ghost" href="#/compare?a=' + bId + '">Compare</a></div>';

    return h;
  }

  function viewTerms() {
    return '<p class="eyebrow">Terms</p><h2>Glossary</h2>' +
      Object.keys(D.glossary).sort(function (x, y) {
        return D.glossary[x].term.localeCompare(D.glossary[y].term);
      }).map(function (k) {
        var g = D.glossary[k];
        return '<div class="axis-block"><h3>' + esc(g.term) + '</h3><p class="lede">' + g.body + '</p></div>';
      }).join('');
  }

  /* ---------- routing ---------- */

  function parseHash() {
    var raw = location.hash.replace(/^#\/?/, ''), qs = {}, qi = raw.indexOf('?');
    if (qi >= 0) {
      raw.slice(qi + 1).split('&').forEach(function (p) {
        var kv = p.split('=');
        qs[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
      });
      raw = raw.slice(0, qi);
    }
    return { parts: raw.split('/').filter(Boolean), qs: qs };
  }

  function render() {
    var r = parseHash(), head = r.parts[0] || '', html;

    switch (head) {
      case '':          html = viewHome(); break;
      case 'explore':   html = viewExplore(); break;
      case 'tradition': html = viewTradition(r.parts[1]); break;
      case 'compare':   html = viewCompare(r.qs); break;
      case 'test':      html = viewTest(); break;
      case 'result':    html = viewResult(); break;
      case 'terms':     html = viewTerms(); break;
      default:          html = viewHome();
    }

    app.innerHTML = html;
    wireTerms(app);
    window.scrollTo(0, 0);

    document.querySelectorAll('nav.tabs a').forEach(function (link) {
      var target = link.getAttribute('href').replace(/^#\/?/, '').split('/')[0];
      if (target === head) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });

    if (head === 'compare') wireCompare();
    if (head === 'result') wireResult();
  }

  function wireCompare() {
    app.querySelectorAll('select[data-seat]').forEach(function (s) {
      s.addEventListener('change', function () {
        go('#/compare?a=' + app.querySelector('[data-seat="a"]').value +
           '&b=' + app.querySelector('[data-seat="b"]').value);
      });
    });
  }

  function wireResult() {
    var out = document.getElementById('code-out');
    var msg = document.getElementById('code-msg');
    function say(t) { if (msg) { msg.textContent = t; msg.hidden = !t; } }

    var payload = { v: 1, a: answers.map(function (n) { return n < 0 ? '-' : String(n); }).join('') };
    window.SaveCode.saveLocal(payload);
    window.SaveCode.create(payload).then(function (c) { if (out) out.value = c; })
      .catch(function () { say('Could not build a save code here.'); });

    document.getElementById('copy-code').addEventListener('click', function () {
      if (!out.value) return;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(out.value).then(
          function () { say('Copied.'); },
          function () { say('Copy blocked. Select it manually.'); });
      } else { out.select(); say('Select it manually.'); }
    });

    document.getElementById('load-code').addEventListener('click', function () {
      window.SaveCode.read(document.getElementById('code-in').value).then(function (o) {
        if (!o || typeof o.a !== 'string') throw new Error('That save code could not be read.');
        answers = o.a.split('').map(function (ch) { return ch === '-' ? -1 : Number(ch); });
        while (answers.length < D.questions.length) answers.push(-1);
        window.SaveCode.saveLocal(o);
        render();
      }).catch(function (e) { say(e && e.message ? e.message : 'That save code could not be read.'); });
    });

    document.getElementById('clear-code').addEventListener('click', function () {
      window.SaveCode.clearLocal();
      resetTest();
      say('Cleared.');
    });
  }

  /* ---------- test interaction ---------- */

  function advance() {
    step++;
    if (step >= D.questions.length) { go('#/result'); return; }
    app.innerHTML = viewTest();
    wireTerms(app);
    window.scrollTo(0, 0);
  }

  app.addEventListener('click', function (e) {
    var c = e.target.closest('[data-answer]');
    if (c) { answers[step] = Number(c.getAttribute('data-answer')); advance(); return; }
    if (e.target.closest('[data-skip]')) { answers[step] = -1; advance(); return; }
    if (e.target.closest('[data-back]')) {
      step = Math.max(0, step - 1);
      app.innerHTML = viewTest();
      wireTerms(app);
      window.scrollTo(0, 0);
    }
  });

  /* ---------- boot ---------- */

  resetTest();
  var saved = window.SaveCode.loadLocal();
  if (saved && typeof saved.a === 'string') {
    answers = saved.a.split('').map(function (ch) { return ch === '-' ? -1 : Number(ch); });
    while (answers.length < D.questions.length) answers.push(-1);
  }

  window.addEventListener('hashchange', render);
  render();
})();

</script>
</body>
</html>
